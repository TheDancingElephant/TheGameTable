<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" font-family="Georgia, serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse" x="40" y="40">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="800" fill="#2a2622"/>
  <text x="360" y="28" text-anchor="middle" fill="#efe6d2" font-size="20" font-weight="bold">Torstadt – Torhaus und Großer Steinwall</text>

  <!-- Vorhöhle (außen) -->
  <rect x="40" y="40" width="250" height="620" fill="#8c8473"/>
  <text x="70" y="70" font-size="14" fill="#efe6d2" font-style="italic">Vorhöhle (außen)</text>
  <!-- Untote -->
  <g fill="#7bd88a" fill-opacity="0.75">
    <circle cx="90" cy="140" r="5"/><circle cx="110" cy="160" r="5"/><circle cx="80" cy="190" r="5"/><circle cx="130" cy="200" r="5"/>
    <circle cx="160" cy="250" r="5"/><circle cx="120" cy="280" r="5"/><circle cx="200" cy="300" r="5"/><circle cx="170" cy="330" r="5"/>
    <circle cx="220" cy="350" r="5"/><circle cx="240" cy="380" r="5"/><circle cx="200" cy="400" r="5"/><circle cx="150" cy="420" r="5"/>
    <circle cx="100" cy="460" r="5"/><circle cx="180" cy="470" r="5"/><circle cx="130" cy="520" r="5"/><circle cx="220" cy="540" r="5"/>
  </g>
  <!-- Sturmleitern -->
  <g stroke="#7a5c3a" stroke-width="4"><line x1="250" y1="170" x2="300" y2="160"/><line x1="250" y1="520" x2="300" y2="530"/></g>
  <g stroke="#7a5c3a" stroke-width="2"><line x1="262" y1="163" x2="264" y2="172"/><line x1="276" y1="161" x2="278" y2="170"/><line x1="262" y1="522" x2="264" y2="531"/><line x1="276" y1="524" x2="278" y2="533"/></g>

  <!-- Innen -->
  <rect x="340" y="40" width="340" height="620" fill="#d9cfb8"/>

  <!-- Wall -->
  <rect x="290" y="40" width="50" height="620" fill="#4a443d"/>
  <rect x="300" y="40" width="30" height="620" fill="#6b6355"/>
  <g fill="#3b3530"><circle cx="315" cy="110" r="22"/><circle cx="315" cy="600" r="22"/></g>
  <text x="315" y="56" text-anchor="middle" font-size="10" fill="#efe6d2">Wehrgang</text>

  <!-- Torhaus -->
  <rect x="270" y="280" width="140" height="150" fill="#5a5147" stroke="#2a2622" stroke-width="3"/>
  <!-- Torweg -->
  <rect x="270" y="335" width="140" height="40" fill="#b9ad94"/>
  <line x1="300" y1="335" x2="300" y2="375" stroke="#1d1d1d" stroke-width="5" stroke-dasharray="3 3"/>
  <rect x="360" y="335" width="8" height="40" fill="#7a5c3a"/>
  <text x="300" y="392" text-anchor="middle" font-size="9" fill="#efe6d2">Fallgitter</text>
  <text x="364" y="392" text-anchor="middle" font-size="9" fill="#efe6d2">Tor</text>
  <!-- Windenraum -->
  <rect x="310" y="290" width="90" height="40" fill="#b9ad94" stroke="#2a2622"/>
  <circle cx="355" cy="310" r="15" fill="none" stroke="#3b2a18" stroke-width="4"/>
  <g stroke="#3b2a18" stroke-width="2"><line x1="355" y1="295" x2="355" y2="325"/><line x1="340" y1="310" x2="370" y2="310"/></g>
  <!-- Treppe -->
  <g stroke="#6b5f4e" stroke-width="2"><line x1="380" y1="385" x2="400" y2="385"/><line x1="380" y1="393" x2="400" y2="393"/><line x1="380" y1="401" x2="400" y2="401"/><line x1="380" y1="409" x2="400" y2="409"/></g>

  <!-- Hof hinter dem Tor -->
  <rect x="410" y="320" width="120" height="70" fill="#e8dfc8" stroke="#9c8f74" stroke-dasharray="4 3"/>
  <!-- Kaserne -->
  <rect x="470" y="80" width="170" height="120" fill="#c9a57a" stroke="#6b4f2a" stroke-width="3"/>
  <rect x="540" y="196" width="30" height="8" fill="#3b2a18"/>
  <text x="555" y="140" text-anchor="middle" font-size="12" fill="#3b2a18">Kaserne</text>
  <text x="555" y="156" text-anchor="middle" font-size="10" fill="#3b2a18">(Drow und Duergar</text>
  <text x="555" y="168" text-anchor="middle" font-size="10" fill="#3b2a18">eingesperrt)</text>
  <!-- Exerzierplatz -->
  <rect x="380" y="80" width="80" height="120" fill="#efe6cf" stroke="#9c8f74"/>
  <text x="420" y="145" text-anchor="middle" font-size="10" fill="#3b2a18">Exerzier-</text><text x="420" y="157" text-anchor="middle" font-size="10" fill="#3b2a18">platz</text>
  <!-- Mauer der Namen -->
  <rect x="350" y="450" width="10" height="90" fill="#111"/>
  <!-- Straße -->
  <rect x="410" y="345" width="270" height="20" fill="#cbbf9f"/>
  <text x="640" y="340" text-anchor="end" font-size="11" fill="#3b2a18">→ Stadt, Pfeiler, Kanzlei</text>

  <!-- Fluss & Wassertor -->
  <rect x="40" y="610" width="640" height="30" fill="#2f6f8f"/>
  <rect x="300" y="606" width="30" height="38" fill="none" stroke="#1d1d1d" stroke-width="3" stroke-dasharray="3 3"/>
  <text x="560" y="630" font-size="11" fill="#dbeef6" font-style="italic">Grovarie</text>

  <!-- Raster -->
  <rect x="40" y="40" width="640" height="620" fill="url(#grid)"/>

  <!-- Nummern -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="180" cy="100" r="12" fill="#8a2d2d"/><text x="180" y="105">1</text>
    <circle cx="315" cy="230" r="12" fill="#8a2d2d"/><text x="315" y="235">2</text>
    <circle cx="285" cy="355" r="12" fill="#8a2d2d"/><text x="285" y="360">3</text>
    <circle cx="385" cy="310" r="12" fill="#8a2d2d"/><text x="385" y="315">4</text>
    <circle cx="470" cy="300" r="12" fill="#8a2d2d"/><text x="470" y="305">5</text>
    <circle cx="655" cy="215" r="12" fill="#8a2d2d"/><text x="655" y="220">6</text>
    <circle cx="380" cy="495" r="12" fill="#8a2d2d"/><text x="380" y="500">7</text>
    <circle cx="350" cy="590" r="12" fill="#8a2d2d"/><text x="350" y="595">8</text>
  </g>

  <!-- Kompass & Maßstab -->
  <g transform="translate(660,80)" fill="#3b2a18" text-anchor="middle"><polygon points="0,-20 5,0 0,-5 -5,0"/><text y="-24" font-size="12">N</text></g>
  <g transform="translate(40,672)" fill="#efe6d2" font-size="11">
    <rect x="0" y="0" width="20" height="6" fill="#efe6d2"/><rect x="20" y="0" width="20" height="6" fill="#8a8173"/>
    <rect x="40" y="0" width="20" height="6" fill="#efe6d2"/><rect x="60" y="0" width="20" height="6" fill="#8a8173"/>
    <text x="0" y="20">0</text><text x="74" y="20">6 m</text><text x="100" y="8">1 Feld = 1,5 m</text>
  </g>

  <!-- Legende -->
  <g transform="translate(40,712)" font-size="12" fill="#efe6d2">
    <text x="0" y="0"><tspan font-weight="bold">1</tspan> Vorhöhle – die Untotenarmee, Sturmleitern</text>
    <text x="0" y="18"><tspan font-weight="bold">2</tspan> Wehrgang – Aufgabe D (Kalkzahn)</text>
    <text x="0" y="36"><tspan font-weight="bold">3</tspan> Torweg mit Fallgitter und Tor</text>
    <text x="0" y="54"><tspan font-weight="bold">4</tspan> Windenraum – Aufgabe B (Gorm, Bleicher Hund)</text>
    <text x="360" y="0"><tspan font-weight="bold">5</tspan> Hof hinter dem Tor</text>
    <text x="360" y="18"><tspan font-weight="bold">6</tspan> Kaserne – Aufgabe A</text>
    <text x="360" y="36"><tspan font-weight="bold">7</tspan> Mauer der Namen</text>
    <text x="360" y="54"><tspan font-weight="bold">8</tspan> Wassertor (Gitter) am Grovarie</text>
    <circle cx="6" cy="74" r="5" fill="#7bd88a" fill-opacity="0.75"/><text x="18" y="78" font-size="11">Untote (Gruppen, nicht einzelne Figuren)</text>
  </g>
</svg>
