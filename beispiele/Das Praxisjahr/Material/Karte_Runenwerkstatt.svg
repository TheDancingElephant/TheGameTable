<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" font-family="Georgia, serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse" x="40" y="40">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <clipPath id="floor">
      <path d="M40 90 L80 70 L190 75 L215 110 L260 100 L330 112 L365 80 L430 62 L505 75 L530 130 L515 205 L470 228 L440 250
               L470 262 L455 300 L485 300 L520 276 L585 270 L615 240 L650 175 L672 170 L680 196 L650 252 L640 300 L652 370 L620 430 L560 448 L500 430 L480 375 L458 380
               L430 410 L390 418 L380 520 L392 600 L360 600 L348 520 L340 420 L300 395 L285 330 L305 270 L345 256 L380 238 L395 222 L360 212 L345 170 L330 145
               L260 140 L215 150 L195 140 L80 150 L40 130 Z"/>
    </clipPath>
  </defs>
  <rect width="720" height="760" fill="#2a2622"/>
  <text x="360" y="28" text-anchor="middle" fill="#efe6d2" font-size="20" font-weight="bold">Finsterhöhlen – die Runenwerkstatt</text>

  <!-- Boden -->
  <path d="M40 90 L80 70 L190 75 L215 110 L260 100 L330 112 L365 80 L430 62 L505 75 L530 130 L515 205 L470 228 L440 250
           L470 262 L455 300 L485 300 L520 276 L585 270 L615 240 L650 175 L672 170 L680 196 L650 252 L640 300 L652 370 L620 430 L560 448 L500 430 L480 375 L458 380
           L430 410 L390 418 L380 520 L392 600 L360 600 L348 520 L340 420 L300 395 L285 330 L305 270 L345 256 L380 238 L395 222 L360 212 L345 170 L330 145
           L260 140 L215 150 L195 140 L80 150 L40 130 Z" fill="#a99f8a" stroke="#5a5147" stroke-width="4"/>

  <!-- Raster nur auf dem Boden -->
  <rect x="40" y="40" width="660" height="580" fill="url(#grid)" clip-path="url(#floor)"/>

  <!-- Schattenkristalle im Kristallgang -->
  <g fill="#3a2b4a" stroke="#8b72b5" stroke-width="1.5">
    <polygon points="225,104 233,92 241,106"/><polygon points="270,98 280,84 288,102"/><polygon points="312,108 320,94 328,112"/>
    <polygon points="230,146 238,160 246,144"/><polygon points="282,138 290,154 298,140"/><polygon points="318,142 326,158 332,144"/>
  </g>
  <!-- Kristalle im Schmugglerstollen -->
  <g fill="#3a2b4a" stroke="#8b72b5" stroke-width="1.5">
    <polygon points="660,180 668,166 674,182"/><polygon points="640,250 652,238 656,256"/>
  </g>

  <!-- Knochen in der Fresskammer -->
  <g stroke="#efe6d2" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="120" x2="420" y2="132"/><line x1="440" y1="160" x2="458" y2="150"/><line x1="470" y1="110" x2="482" y2="128"/>
    <line x1="410" y1="180" x2="428" y2="186"/><line x1="480" y1="180" x2="492" y2="168"/>
  </g>
  <g fill="#efe6d2"><circle cx="452" cy="118" r="5"/><circle cx="430" cy="140" r="4"/></g>

  <!-- Karre mit Barren -->
  <rect x="330" y="300" width="60" height="34" fill="#7a5c3a" stroke="#3b2a18" stroke-width="2"/>
  <g fill="#1d1d1d"><rect x="336" y="306" width="14" height="8"/><rect x="354" y="306" width="14" height="8"/><rect x="372" y="306" width="14" height="8"/>
    <rect x="336" y="318" width="14" height="8"/><rect x="354" y="318" width="14" height="8"/></g>
  <circle cx="340" cy="338" r="5" fill="#3b2a18"/><circle cx="380" cy="338" r="5" fill="#3b2a18"/>

  <!-- Werkbank -->
  <rect x="540" y="330" width="80" height="30" fill="#7d766b" stroke="#3b3530" stroke-width="2"/>
  <circle cx="556" cy="345" r="6" fill="#000" stroke="#cfe3ff" stroke-width="1.5"/>
  <circle cx="574" cy="345" r="6" fill="#000" stroke="#cfe3ff" stroke-width="1.5"/>
  <circle cx="592" cy="345" r="6" fill="#000" stroke="#cfe3ff" stroke-width="1.5"/>
  <ellipse cx="610" cy="345" rx="7" ry="5" fill="#c7c9cf"/>

  <!-- Schmugglerkisten -->
  <rect x="655" y="200" width="16" height="14" fill="#9c7b4f" stroke="#3b2a18"/><rect x="660" y="216" width="16" height="14" fill="#9c7b4f" stroke="#3b2a18"/>

  <!-- Kreidezeichen am Zugang -->
  <text x="118" y="96" font-size="12" fill="#efe6d2">Säulenzeichen</text>

  <!-- Richtungen -->
  <text x="48" y="64" font-size="12" fill="#efe6d2">← vom Bruch / aus den Finsterhöhlen</text>
  <text x="400" y="590" font-size="12" fill="#efe6d2">↓ Tunnel Richtung Land der Untoten</text>

  <!-- Nummern -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="120" cy="120" r="12" fill="#8a2d2d"/><text x="120" y="125">1</text>
    <circle cx="275" cy="122" r="12" fill="#8a2d2d"/><text x="275" y="127">2</text>
    <circle cx="455" cy="200" r="12" fill="#8a2d2d"/><text x="455" y="205">3</text>
    <circle cx="320" cy="370" r="12" fill="#8a2d2d"/><text x="320" y="375">4</text>
    <circle cx="560" cy="400" r="12" fill="#8a2d2d"/><text x="560" y="405">5</text>
    <circle cx="640" cy="290" r="12" fill="#8a2d2d"/><text x="640" y="295">6</text>
  </g>

  <!-- Kompass & Maßstab -->
  <g transform="translate(670,80)" fill="#efe6d2" text-anchor="middle"><polygon points="0,-20 5,0 0,-5 -5,0"/><text y="-24" font-size="12">N</text></g>
  <g transform="translate(40,630)" fill="#efe6d2" font-size="11">
    <rect x="0" y="0" width="20" height="6" fill="#efe6d2"/><rect x="20" y="0" width="20" height="6" fill="#8a8173"/>
    <rect x="40" y="0" width="20" height="6" fill="#efe6d2"/><rect x="60" y="0" width="20" height="6" fill="#8a8173"/>
    <text x="0" y="20">0</text><text x="74" y="20">6 m</text><text x="100" y="8">1 Feld = 1,5 m</text>
  </g>

  <!-- Legende -->
  <g transform="translate(40,672)" font-size="12" fill="#efe6d2">
    <text x="0" y="0"><tspan font-weight="bold">1</tspan> Zugang (Säulenzeichen, „Willkommen")</text>
    <text x="0" y="18"><tspan font-weight="bold">2</tspan> Kristallgang (Dunkelsicht nur 4,5 m)</text>
    <text x="0" y="36"><tspan font-weight="bold">3</tspan> Fresskammer – 2 Ghule</text>
    <text x="340" y="0"><tspan font-weight="bold">4</tspan> Ladeplatz – Karre mit Barren</text>
    <text x="340" y="18"><tspan font-weight="bold">5</tspan> Runenwerkstatt – Ghast, Werkbank, Lieferliste</text>
    <text x="340" y="36"><tspan font-weight="bold">6</tspan> Schmugglerstollen (Kisten mit Säulenzeichen)</text>
    <polygon points="0,58 8,46 14,60" fill="#3a2b4a" stroke="#8b72b5"/><text x="20" y="58">Schattenkristall</text>
    <circle cx="168" cy="53" r="6" fill="#000" stroke="#cfe3ff" stroke-width="1.5"/><text x="180" y="58">halbfertiger Lauschstein</text>
    <text x="340" y="58" font-size="11" fill="#bfb5a2">Überall: Licht halber Radius, Dunkelsicht nur 9 m.</text>
  </g>
</svg>
