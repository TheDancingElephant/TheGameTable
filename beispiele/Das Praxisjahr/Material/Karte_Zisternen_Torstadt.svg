<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" font-family="Georgia, serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse" x="40" y="40">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <clipPath id="room7"><rect x="440" y="460" width="160" height="180"/></clipPath>
  </defs>

  <!-- Fels -->
  <rect x="0" y="0" width="720" height="800" fill="#3b3530"/>
  <text x="360" y="28" text-anchor="middle" fill="#efe6d2" font-size="20" font-weight="bold">Die Zisternen unter dem Steinwall – Torstadt</text>

  <!-- 1 Einstieg -->
  <rect x="260" y="60" width="60" height="60" fill="#d9cfb8"/>
  <g stroke="#6b5f4e" stroke-width="2">
    <line x1="265" y1="70" x2="315" y2="70"/><line x1="265" y1="80" x2="315" y2="80"/>
    <line x1="265" y1="90" x2="315" y2="90"/><line x1="265" y1="100" x2="315" y2="100"/>
    <line x1="265" y1="110" x2="315" y2="110"/>
  </g>
  <rect x="280" y="120" width="20" height="40" fill="#d9cfb8"/>

  <!-- 2 Pumpenkammer -->
  <rect x="200" y="160" width="180" height="120" fill="#d9cfb8"/>
  <circle cx="300" cy="220" r="26" fill="#b08d57" stroke="#5a4426" stroke-width="3"/>
  <circle cx="300" cy="220" r="10" fill="#5a4426"/>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#5a4426">Pumpe / Hebel</text>

  <!-- Gänge West/Ost -->
  <rect x="100" y="200" width="100" height="20" fill="#d9cfb8"/>
  <rect x="380" y="200" width="100" height="20" fill="#d9cfb8"/>

  <!-- 3 Überlaufbecken -->
  <rect x="40" y="220" width="140" height="20" fill="#d9cfb8"/>
  <rect x="40" y="240" width="140" height="140" fill="#2f6f8f"/>
  <text x="110" y="320" text-anchor="middle" font-size="11" fill="#dbeef6">tiefes Wasser</text>
  <!-- gefluteter Durchgang -->
  <rect x="100" y="380" width="20" height="60" fill="#2f6f8f"/>
  <text x="128" y="415" font-size="10" fill="#dbeef6">gefluteter Durchgang</text>

  <!-- 4 Geräteraum -->
  <rect x="480" y="160" width="100" height="100" fill="#d9cfb8"/>
  <rect x="478" y="198" width="6" height="24" fill="#7a5c3a"/>
  <rect x="545" y="225" width="18" height="18" fill="#9c7b4f"/><rect x="560" y="170" width="14" height="14" fill="#9c7b4f"/>
  <text x="560" y="250" font-size="14" font-weight="bold" fill="#8a2d2d">T</text>

  <!-- 5 Schacht -->
  <rect x="280" y="280" width="20" height="160" fill="#c9bea6"/>
  <text x="306" y="365" font-size="10" fill="#efe6d2">eng (gequetscht)</text>

  <!-- 6 Hauptzisterne -->
  <rect x="80" y="440" width="360" height="200" fill="#8fc1d6"/>
  <rect x="320" y="440" width="40" height="200" fill="#2f6f8f"/>
  <rect x="320" y="540" width="40" height="20" fill="#8a6a42"/>
  <text x="340" y="584" text-anchor="middle" font-size="10" fill="#dbeef6">Kanal</text>
  <text x="340" y="534" text-anchor="middle" font-size="10" fill="#efe6d2">Steg</text>
  <g fill="#7d766b" stroke="#4a443d" stroke-width="2">
    <circle cx="150" cy="510" r="9"/><circle cx="150" cy="590" r="9"/>
    <circle cx="230" cy="510" r="9"/><circle cx="230" cy="590" r="9"/>
    <circle cx="410" cy="510" r="9"/><circle cx="410" cy="590" r="9"/>
  </g>
  <text x="398" y="494" font-size="12" font-weight="bold" fill="#fff">K</text>

  <!-- 7 Pfeilerfundament -->
  <rect x="440" y="460" width="160" height="180" fill="#8fc1d6"/>
  <g clip-path="url(#room7)">
    <circle cx="680" cy="550" r="110" fill="#2b2622" stroke="#4a443d" stroke-width="3"/>
    <g fill="#6fb6ff">
      <circle cx="575" cy="520" r="4"/><circle cx="572" cy="550" r="4"/><circle cx="575" cy="580" r="4"/>
      <circle cx="584" cy="495" r="4"/><circle cx="584" cy="605" r="4"/>
    </g>
  </g>
  <ellipse cx="520" cy="550" rx="40" ry="34" fill="#7a5c3a" stroke="#4e3a22" stroke-width="2"/>
  <circle cx="522" cy="552" r="7" fill="#000" stroke="#cfe3ff" stroke-width="2"/>
  <text x="520" y="600" text-anchor="middle" font-size="10" fill="#2b2622">Nest</text>
  <text x="590" y="476" text-anchor="end" font-size="10" fill="#efe6d2">Zentralpfeiler</text>

  <!-- Raster -->
  <rect x="40" y="40" width="600" height="600" fill="url(#grid)"/>

  <!-- Nummern -->
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="245" cy="78" r="12" fill="#8a2d2d"/><text x="245" y="83">1</text>
    <circle cx="222" cy="182" r="12" fill="#8a2d2d"/><text x="222" y="187">2</text>
    <circle cx="62" cy="262" r="12" fill="#8a2d2d"/><text x="62" y="267">3</text>
    <circle cx="502" cy="182" r="12" fill="#8a2d2d"/><text x="502" y="187">4</text>
    <circle cx="262" cy="330" r="12" fill="#8a2d2d"/><text x="262" y="335">5</text>
    <circle cx="102" cy="462" r="12" fill="#8a2d2d"/><text x="102" y="467">6</text>
    <circle cx="462" cy="482" r="12" fill="#8a2d2d"/><text x="462" y="487">7</text>
  </g>

  <!-- Kompass & Maßstab -->
  <g transform="translate(660,90)" fill="#efe6d2" text-anchor="middle">
    <polygon points="0,-24 6,0 0,-6 -6,0"/>
    <text y="-28" font-size="12">N</text>
  </g>
  <g transform="translate(40,660)" fill="#efe6d2" font-size="11">
    <rect x="0" y="0" width="20" height="6" fill="#efe6d2"/><rect x="20" y="0" width="20" height="6" fill="#8a8173"/>
    <rect x="40" y="0" width="20" height="6" fill="#efe6d2"/><rect x="60" y="0" width="20" height="6" fill="#8a8173"/>
    <text x="0" y="20">0</text><text x="74" y="20">6 m</text>
    <text x="100" y="8">1 Feld = 1,5 m</text>
  </g>

  <!-- Legende -->
  <g transform="translate(40,700)" font-size="12" fill="#efe6d2">
    <rect x="0" y="0" width="16" height="12" fill="#d9cfb8"/><text x="22" y="10">Steinboden</text>
    <rect x="130" y="0" width="16" height="12" fill="#8fc1d6"/><text x="152" y="10">flaches Wasser (schwieriges Gelände)</text>
    <rect x="400" y="0" width="16" height="12" fill="#2f6f8f"/><text x="422" y="10">tiefes Wasser (Schwimmen SG 10)</text>
    <rect x="0" y="24" width="16" height="12" fill="#c9bea6"/><text x="22" y="34">enger Schacht</text>
    <circle cx="138" cy="30" r="6" fill="#7d766b"/><text x="152" y="34">Säule</text>
    <text x="226" y="34" font-weight="bold">K</text><text x="240" y="34">Kreidemarkierungen</text>
    <text x="400" y="34" font-weight="bold" fill="#e08a8a">T</text><text x="414" y="34">Tamla</text>
    <circle cx="8" cy="54" r="6" fill="#000" stroke="#cfe3ff" stroke-width="2"/><text x="22" y="58">schwarzer Runenstein</text>
    <text x="0" y="82" font-size="11" fill="#bfb5a2">Läuft die Pumpe (Bereich 2), sinkt der Wasserspiegel: Kanal und gefluteter Durchgang werden hüfthoch.</text>
  </g>
</svg>
