<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" font-family="Georgia, serif">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse" x="40" y="40">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#7bd88a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7bd88a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="floor">
      <path d="M300 40 L360 40 L372 110 L470 100 L590 140 L650 230 L660 360 L620 470 L560 540 L430 560 L392 640 L330 640 L300 560 L170 540 L90 460 L60 330 L90 200 L180 120 L290 110 Z"/>
    </clipPath>
  </defs>
  <rect width="720" height="780" fill="#2a2622"/>
  <text x="360" y="28" text-anchor="middle" fill="#efe6d2" font-size="20" font-weight="bold">Das Gefangenenlager am Rand des Grauen Hofs</text>
  <path d="M300 40 L360 40 L372 110 L470 100 L590 140 L650 230 L660 360 L620 470 L560 540 L430 560 L392 640 L330 640 L300 560 L170 540 L90 460 L60 330 L90 200 L180 120 L290 110 Z"
        fill="#9e9686" stroke="#4e463d" stroke-width="4"/>
  <rect x="300" y="520" width="140" height="140" fill="url(#glow)" clip-path="url(#floor)"/>
  <rect x="40" y="40" width="640" height="620" fill="url(#grid)" clip-path="url(#floor)"/>
  <circle cx="335" cy="150" r="12" fill="#7bd88a" stroke="#2f6b3a" stroke-width="2"/>
  <g stroke="#2c3731" stroke-width="4"><line x1="290" y1="128" x2="310" y2="128"/><line x1="360" y1="128" x2="380" y2="128"/></g>
  <g fill="none" stroke="#3b3530" stroke-width="3">
    <rect x="110" y="220" width="90" height="70"/><rect x="110" y="310" width="90" height="70"/><rect x="110" y="400" width="90" height="70"/>
  </g>
  <g stroke="#3b3530" stroke-width="1.5">
    <line x1="130" y1="220" x2="130" y2="290"/><line x1="155" y1="220" x2="155" y2="290"/><line x1="180" y1="220" x2="180" y2="290"/>
    <line x1="130" y1="310" x2="130" y2="380"/><line x1="155" y1="310" x2="155" y2="380"/><line x1="180" y1="310" x2="180" y2="380"/>
    <line x1="130" y1="400" x2="130" y2="470"/><line x1="155" y1="400" x2="155" y2="470"/><line x1="180" y1="400" x2="180" y2="470"/>
  </g>
  <g font-size="10" fill="#2a2622" text-anchor="middle">
    <text x="155" y="258">Soldaten</text><text x="155" y="348">Soldaten</text><text x="155" y="430">Ilun, Szar</text><text x="155" y="442">Soldaten</text>
  </g>
  <circle cx="360" cy="330" r="62" fill="#1f3d27" fill-opacity="0.25" stroke="#7bd88a" stroke-dasharray="6 4" stroke-width="2"/>
  <polygon points="360,296 372,330 360,364 348,330" fill="#111" stroke="#4e463d" stroke-width="2"/>
  <text x="360" y="386" text-anchor="middle" font-size="10" fill="#1f3d27">Aura</text>
  <polygon points="520,250 600,250 610,320 510,320" fill="#5a3f3f" stroke="#2a1d1d" stroke-width="2"/>
  <line x1="560" y1="250" x2="560" y2="320" stroke="#2a1d1d"/>
  <circle cx="490" cy="300" r="10" fill="#7bd88a" stroke="#2f6b3a" stroke-width="2"/>
  <g fill="#d8d0bc" stroke="#6b6355"><ellipse cx="230" cy="500" rx="28" ry="12"/><ellipse cx="270" cy="470" rx="18" ry="9"/></g>
  <g fill="#7a5c3a"><rect x="300" y="480" width="16" height="12"/><rect x="320" y="494" width="16" height="12"/></g>
  <path d="M650 300 L690 290 L700 330 L660 340 Z" fill="#9e9686" stroke="#4e463d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="664" y="360" font-size="10" fill="#efe6d2">Spalt der</text><text x="664" y="372" font-size="10" fill="#efe6d2">Winzlinge</text>
  <text x="372" y="60" font-size="12" fill="#efe6d2">↑ Kammweg · Klagebach (½ Std.) · Knochenwacht</text>
  <text x="400" y="660" font-size="12" fill="#bdf0c4">↓ zum Grauen Hof (grünes Licht)</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="330" cy="80" r="12" fill="#8a2d2d"/><text x="330" y="85">1</text>
    <circle cx="300" cy="160" r="12" fill="#8a2d2d"/><text x="300" y="165">2</text>
    <circle cx="225" cy="250" r="12" fill="#8a2d2d"/><text x="225" y="255">3</text>
    <circle cx="410" cy="300" r="12" fill="#8a2d2d"/><text x="410" y="305">4</text>
    <circle cx="560" cy="345" r="12" fill="#8a2d2d"/><text x="560" y="350">5</text>
    <circle cx="250" cy="530" r="12" fill="#8a2d2d"/><text x="250" y="535">6</text>
    <circle cx="362" cy="600" r="12" fill="#8a2d2d"/><text x="362" y="605">7</text>
  </g>
  <g transform="translate(670,90)" fill="#efe6d2" text-anchor="middle"><polygon points="0,-20 5,0 0,-5 -5,0"/><text y="-24" font-size="12">N</text></g>
  <g transform="translate(40,680)" fill="#efe6d2" font-size="11">
    <rect x="0" y="0" width="20" height="6" fill="#efe6d2"/><rect x="20" y="0" width="20" height="6" fill="#8a8173"/>
    <rect x="40" y="0" width="20" height="6" fill="#efe6d2"/><rect x="60" y="0" width="20" height="6" fill="#8a8173"/>
    <text x="0" y="20">0</text><text x="74" y="20">6 m</text><text x="100" y="8">1 Feld = 1,5 m</text>
  </g>
  <g transform="translate(40,722)" font-size="12" fill="#efe6d2">
    <text x="0" y="0"><tspan font-weight="bold">1</tspan> Kammweg (Zugang)</text>
    <text x="0" y="18"><tspan font-weight="bold">2</tspan> Lagertor, Wachfeuer – 2 Ghule</text>
    <text x="0" y="36"><tspan font-weight="bold">3</tspan> Pferche – 19 Gefangene, Ilun, Szar</text>
    <text x="250" y="0"><tspan font-weight="bold">4</tspan> Kleiner Obelisk mit Aura</text>
    <text x="250" y="18"><tspan font-weight="bold">5</tspan> Zelt – Mutter Asch, Herold in Eisen</text>
    <text x="250" y="36"><tspan font-weight="bold">6</tspan> Arbeitsplatz – 6 Zombies</text>
    <text x="500" y="0"><tspan font-weight="bold">7</tspan> Südausgang</text>
    <text x="500" y="18">von hier kommt der</text>
    <text x="500" y="36">Bleiche Hund</text>
  </g>
</svg>
